[package]
name = "code-index"
version = "0.1.0"
edition = "2021"
description = "Persistent semantic cache for AI agents - indexes codebases with tree-sitter"
authors = ["Mason"]
license = "MIT"

[dependencies]
# Core functionality
tree-sitter = "0.24"
tree-sitter-rust = "0.23"
tree-sitter-typescript = "0.23"
tree-sitter-javascript = "0.23"
tree-sitter-python = "0.23"

# Database
rusqlite = { version = "0.32", features = ["bundled"] }

# File system watching
notify = "7.0"
notify-debouncer-mini = "0.5"

# Async runtime
tokio = { version = "1.43", features = ["full"] }

# CLI
clap = { version = "4.5", features = ["derive"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Logging
log = "0.4"
env_logger = "0.11"

# Utilities
walkdir = "2.5"
daemonize = "0.5"
chrono = "0.4"
ctrlc = "3.4"
dirs = "5.0"
libc = "0.2"

[dev-dependencies]
tempfile = "3.14"
assert_cmd = "2.0"
predicates = "3.1"

[[bin]]
name = "code-index"
path = "src/main.rs"

[lib]
name = "code_index"
path = "src/lib.rs"
